<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông báo thay đổi mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">

<div style="max-width: 600px; margin: auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <div style="background-color: #1890ff; color: #fff; padding: 16px; text-align: center; font-size: 18px; font-weight: bold;">
        Xác nhận thay đổi mật khẩu
    </div>
    <div style="padding: 20px; color: #333;">
        <p>Xin chào <strong th:text="${email}"></strong>,</p>
        <p>Bạn đã thay đổi mật khẩu thành công vào lúc:</p>
        <p style="font-size: 16px; font-weight: bold; color: #1890ff;" th:text="${time}"></p>
        <p>Nếu không phải bạn thực hiện thao tác này, vui lòng liên hệ ngay với bộ phận hỗ trợ để bảo vệ tài khoản.</p>
        <p style="margin-top: 24px;">Trân trọng,<br>Đội ngũ hỗ trợ</p>
        <p>Đây là email tự động, vui lòng không trả lời.</p>
    </div>
</div>

</body>
</html>
