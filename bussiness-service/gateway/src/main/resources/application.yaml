server:
  port: 8080

app:
  api-prefix: /api

spring:
  application.name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/api/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "https://project-datn-umber.vercel.app/"
              - "https://project-datn-git-front-end-dangchien2003s-projects.vercel.app/"
              - "https://smart-parking-v1.netlify.app/"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: parking-service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/parking/**
          filters:
            - StripPrefix=2
        - id: notify-service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/notify/**
          filters:
            - StripPrefix=2
        - id: notify-sockjs-http
          uri: http://localhost:8083
          predicates:
            - Path=/ws/** # forward SockJS info (HTTP) requests
          filters:
            - StripPrefix=0
        - id: notify-sockjs-ws
          uri: ws://localhost:8083
          predicates:
            - Path=/ws/** # forward websocket upgrade & other websocket paths

